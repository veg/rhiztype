name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# docs/pkg is a committed wasm-pack artifact and is not checked here.
# To rebuild it, run the wasm-pack command documented in README.md.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rhiztype-wasm --target wasm32-unknown-unknown --locked
