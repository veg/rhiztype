[package]
name = "rhiztype-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for RhizType HIV-1 subtyping and mosaic deconvolution"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhiztype-core = { path = "../rhiztype-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
