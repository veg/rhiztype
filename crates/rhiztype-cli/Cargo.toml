[package]
name = "rhiztype-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line HIV-1 Group M subtyping and recombination classifier"
license = "MIT"

[[bin]]
name = "rhiztype"
path = "src/main.rs"

[dependencies]
rhiztype-core = { path = "../rhiztype-core" }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
